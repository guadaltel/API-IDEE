<div class="m-rastermanagement-histogram">
    <p id="m-rastermanagement-histogram-empty" class="m-rastermanagement-histogram-message hidden">{{selectLayerHint}}</p>
    <div id="m-rastermanagement-histogram-actions" class="m-rastermanagement-histogram-actions hidden">
        <button type="button" id="m-rastermanagement-histogram-calculate" class="m-rastermanagement-histogram-calculate" tabindex="0" title="{{histogramCalculate}}" aria-label="{{histogramCalculate}}">{{histogramCalculate}}</button>
    </div>
    <div id="m-rastermanagement-histogram-loading-row" class="m-rastermanagement-histogram-loading-row hidden">
        <button type="button" id="m-rastermanagement-histogram-cancel" class="m-rastermanagement-histogram-cancel" tabindex="0" title="{{histogramCancel}}" aria-label="{{histogramCancel}}">{{histogramCancel}}</button>
        <p id="m-rastermanagement-histogram-loading" class="m-rastermanagement-histogram-message">{{histogramLoading}}</p>
    </div>
    <p id="m-rastermanagement-histogram-error" class="m-rastermanagement-histogram-message m-rastermanagement-histogram-error hidden"></p>
    <div id="m-rastermanagement-histogram-content" class="hidden">
        <div id="m-rastermanagement-histogram-band-row" class="m-rastermanagement-histogram-band-row hidden">
            <label for="m-rastermanagement-histogram-band">{{band}}</label>
            <select id="m-rastermanagement-histogram-band" class="m-rastermanagement-histogram-band-select"></select>
        </div>
        <div class="m-rastermanagement-histogram-chart-wrap">
            <h3 class="m-rastermanagement-histogram-stats-title">{{histogramChart}}</h3>
            <div class="m-rastermanagement-histogram-chart-box">
                <canvas id="m-rastermanagement-histogram-chart" aria-label="{{histogramChart}}" role="img"></canvas>
            </div>
        </div>
        <h3 class="m-rastermanagement-histogram-stats-title">{{descriptiveStats}}</h3>
        <div class="m-rastermanagement-histogram-stats-grid">
            <div class="m-rastermanagement-histogram-stat">
                <span id="m-rastermanagement-histogram-stat-pixels" class="m-rastermanagement-histogram-stat-value">-</span>
                <span class="m-rastermanagement-histogram-stat-label">{{statPixels}}</span>
            </div>
            <div class="m-rastermanagement-histogram-stat">
                <span id="m-rastermanagement-histogram-stat-min" class="m-rastermanagement-histogram-stat-value">-</span>
                <span class="m-rastermanagement-histogram-stat-label">{{statMin}}</span>
            </div>
            <div class="m-rastermanagement-histogram-stat">
                <span id="m-rastermanagement-histogram-stat-max" class="m-rastermanagement-histogram-stat-value">-</span>
                <span class="m-rastermanagement-histogram-stat-label">{{statMax}}</span>
            </div>
            <div class="m-rastermanagement-histogram-stat">
                <span id="m-rastermanagement-histogram-stat-mean" class="m-rastermanagement-histogram-stat-value">-</span>
                <span class="m-rastermanagement-histogram-stat-label">{{statMean}}</span>
            </div>
            <div class="m-rastermanagement-histogram-stat">
                <span id="m-rastermanagement-histogram-stat-median" class="m-rastermanagement-histogram-stat-value">-</span>
                <span class="m-rastermanagement-histogram-stat-label">{{statMedian}}</span>
            </div>
            <div class="m-rastermanagement-histogram-stat">
                <span id="m-rastermanagement-histogram-stat-stddev" class="m-rastermanagement-histogram-stat-value">-</span>
                <span class="m-rastermanagement-histogram-stat-label">{{statStdDev}}</span>
            </div>
            <div class="m-rastermanagement-histogram-stat">
                <span id="m-rastermanagement-histogram-stat-p25" class="m-rastermanagement-histogram-stat-value">-</span>
                <span class="m-rastermanagement-histogram-stat-label">{{statPercentile25}}</span>
            </div>
            <div class="m-rastermanagement-histogram-stat">
                <span id="m-rastermanagement-histogram-stat-p75" class="m-rastermanagement-histogram-stat-value">-</span>
                <span class="m-rastermanagement-histogram-stat-label">{{statPercentile75}}</span>
            </div>
        </div>
    </div>
</div>
