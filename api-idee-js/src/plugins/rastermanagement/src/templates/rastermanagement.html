<div id="div-contenedor-m-rastermanagement" class="m-control m-container m-rastermanagement">
    <!-- TITLE -->
    <div tabindex="0" role="heading" class="title" aria-label="{{title}}">{{title}}</div>
    <div class="m-rastermanagement-layer-selector">
        <select tabindex="0" role="select" id="m-rastermanagement-selectionlayer" title="{{selectLayer}}" aria-label="{{selectLayer}}">
            <option value="" selected disabled>{{selectLayerDefault}}...</option>
        </select>
        <button type="button" tabindex="0" id="m-rastermanagement-apply" class="g-cartografia-raster-apply" title="{{apply}}" aria-label="{{apply}}"></button>
        <button type="button" tabindex="0" id="m-rastermanagement-clear" class="g-cartografia-raster-reset" title="{{clearStyle}}" aria-label="{{clearStyle}}"></button>
        <button type="button" tabindex="0" id="m-rastermanagement-copy" class="g-cartografia-raster-copy" title="{{copyStyle}}" aria-label="{{copyStyle}}"></button>
    </div>
    <div id="m-rastermanagement-tabs" role="tablist">
        <div id="m-rastermanagement-colorramps-tab" class="m-rastermanagement-tab active" role="tab" tabindex="0" aria-selected="true" aria-controls="m-rastermanagement-colorramps-tab-content">{{colorRamps}}</div>
        <div id="m-rastermanagement-spectralindices-tab" class="m-rastermanagement-tab" role="tab" tabindex="0" aria-selected="false" aria-controls="m-rastermanagement-spectralindices-tab-content">{{spectralIndices}}</div>
    </div>
    <div id="m-rastermanagement-tabs-contents">
        <div id="m-rastermanagement-colorramps-tab-content" class="m-rastermanagement-tab-content" role="tabpanel" aria-labelledby="m-rastermanagement-colorramps-tab">
            <p>contenido rampas de color</p>
        </div>
        <div id="m-rastermanagement-spectralindices-tab-content" class="m-rastermanagement-tab-content hidden" role="tabpanel" aria-labelledby="m-rastermanagement-spectralindices-tab">
            <p>contenido indices espectrales</p>
        </div>
    </div>
    <div class="m-rastermanagement-filters">
        <h3 class="m-rastermanagement-section-title">{{filters}}</h3>
        <div class="m-rastermanagement-filters-grid">
            <div class="m-rastermanagement-filter-control">
                <div class="m-rastermanagement-filter-header">
                    <label for="m-rastermanagement-saturation">{{saturation}}</label>
                    <span id="m-rastermanagement-saturation-value" class="m-rastermanagement-filter-value">{{defaults.saturation}}</span>
                </div>
                <input type="range" id="m-rastermanagement-saturation" name="saturation" min="-1" max="1" value="{{defaults.saturation}}" step="0.01" tabindex="0" aria-label="{{saturation}}">
            </div>
            <div class="m-rastermanagement-filter-control">
                <div class="m-rastermanagement-filter-header">
                    <label for="m-rastermanagement-brightness">{{brightness}}</label>
                    <span id="m-rastermanagement-brightness-value" class="m-rastermanagement-filter-value">{{defaults.brightness}}</span>
                </div>
                <input type="range" id="m-rastermanagement-brightness" name="brightness" min="-1" max="1" value="{{defaults.brightness}}" step="0.01" tabindex="0" aria-label="{{brightness}}">
            </div>
            <div class="m-rastermanagement-filter-control">
                <div class="m-rastermanagement-filter-header">
                    <label for="m-rastermanagement-contrast">{{contrast}}</label>
                    <span id="m-rastermanagement-contrast-value" class="m-rastermanagement-filter-value">{{defaults.contrast}}</span>
                </div>
                <input type="range" id="m-rastermanagement-contrast" name="contrast" min="-1" max="1" value="{{defaults.contrast}}" step="0.01" tabindex="0" aria-label="{{contrast}}">
            </div>
            <div class="m-rastermanagement-filter-control">
                <div class="m-rastermanagement-filter-header">
                    <label for="m-rastermanagement-exposure">{{exposure}}</label>
                    <span id="m-rastermanagement-exposure-value" class="m-rastermanagement-filter-value">{{defaults.exposure}}</span>
                </div>
                <input type="range" id="m-rastermanagement-exposure" name="exposure" min="-1" max="1" value="{{defaults.exposure}}" step="0.01" tabindex="0" aria-label="{{exposure}}">
            </div>
            <div class="m-rastermanagement-filter-control">
                <div class="m-rastermanagement-filter-header">
                    <label for="m-rastermanagement-gamma">{{gamma}}</label>
                </div>
                <input type="number" id="m-rastermanagement-gamma" name="gamma" min="0" value="{{defaults.gamma}}" step="0.01" tabindex="0" aria-label="{{gamma}}">
            </div>
        </div>
    </div>
</div>
