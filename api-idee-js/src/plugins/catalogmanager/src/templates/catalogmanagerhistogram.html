<div class="m-catalogmanager-histogram">
    <div class="m-catalogmanager-histogram-controls">
        <label for="m-catalogmanager-histogram-band">{{translations.band}}</label>
        <select id="m-catalogmanager-histogram-band" class="m-catalogmanager-histogram-band-select">
            {{#each bands}}
            <option value="{{index}}">{{../translations.band}} {{name}}</option>
            {{/each}}
        </select>
    </div>
    <div class="m-catalogmanager-histogram-chart-container">
        <canvas class="m-catalogmanager-histogram-canvas"></canvas>
    </div>
    <div class="m-catalogmanager-histogram-stats-container"></div>
</div>
