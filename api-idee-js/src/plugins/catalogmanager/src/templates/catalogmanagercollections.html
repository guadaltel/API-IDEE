<ul class="m-catalogmanager-ulcollections">
    {{#each collections}}
        <li tabindex="0" class="m-catalogmanager-sectionPanel">
            <div class="m-catalogmanager-title-collection"
                data-collection-id="{{id}}" data-catalog-index="{{catalogIndex}}" data-collection-index="{{index}}">
                <div class="m-catalogmanager-visible-typeContent">
                    <table style="width: 100%;">
                        <tbody>
                            <tr>
                                <td><span class="icon-picture m-catalogmanager-title-box"  
                                        data-collection-id="{{id}}" title="{{title}}" 
                                        tabindex="0">
                                        {{title}}
                                    </span>
                                </td>
                                <td style="text-align: end;">
                                    <button class="m-catalogmanager-footprint-button">{{../translations.footprint}}</button>
                                    <button class="m-catalogmanager-filter-button"><span class="icon-filter m-catalogmanager-filter-button"></span></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="m-catalogmanager-items collection-{{id}} hidden empty"
            data-collection-id="{{id}}" data-catalog-index="{{catalogIndex}}" data-collection-index="{{index}}"></div>
        </li>
    {{/each}}
</ul>
