<div class="m-catalogmanager-collections-container">
    <div class="m-catalogmanager-collections-order">
        <button id="sort-name-up" class="m-catalogmanager-collections-order-button" title="{{translations.filtersTypes.collections.order.title}}">
            <span class="icon-sort-name-up"></span>
        </button>
        <button id="sort-name-down" class="m-catalogmanager-collections-order-button" title="{{translations.filtersTypes.collections.order.title}}">
            <span class="icon-sort-name-down"></span>
        </button>
        <button id="sort-date-up" class="m-catalogmanager-collections-order-button" title="{{translations.filtersTypes.collections.order.title}}">
            <span class="icon-sort-alt-up"></span><span class="icon-calendar"></span>
        </button>
        <button id="sort-date-down" class="m-catalogmanager-collections-order-button" title="{{translations.filtersTypes.collections.order.title}}">
            <span class="icon-sort-alt-down"></span><span class="icon-calendar"></span>
        </button>
    </div>
    <div class="m-catalogmanager-collections-list">
        {{#each collections}}
            <div class="m-catalogmanager-sectionPanel">
                <div class="m-catalogmanager-title-collection {{#if selected}}active{{/if}}" 
                    data-collection-id="{{id}}" data-catalog-index="{{catalogIndex}}"
                    data-collection-index="{{index}}" title="{{title}}">
                    {{title}}
                </div>
            </div>
        {{/each}}
    </div>
</div>
