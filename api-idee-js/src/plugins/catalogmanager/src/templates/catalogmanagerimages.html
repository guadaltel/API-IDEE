<table class="m-catalogmanager-tableimages" style="width: 100%;">
    <thead>
        <tr>
            <th>{{translations.images}}</th>
            <th style="text-align: center;">{{translations.actions}}</th>
        </tr>
    </thead>
    <tbody>
    {{#each images}}
        <tr class="m-catalogmanager-title-image" data-image-key="{{key}}" data-item-id="{{itemId}}" data-collection-index="{{collectionIndex}}" data-catalog-index="{{catalogIndex}}">
            <td><span class="m-catalogmanager-title-box"  
                    title="{{title}}" tabindex="0">
                    {{title}}
                </span>
            </td>
            <td style="text-align: center;">
                <button class="m-catalogmanager-preview-button action-btn" title="{{../translations.imageActions.preview}}"><span class="icon-eye m-catalogmanager-preview-button"></span></button>
                {{#if ../downloadable}}<button class="m-catalogmanager-download-button action-btn" title="{{../translations.imageActions.download}}"><span class="icon-download m-catalogmanager-download-button"></span></button>{{/if}}
            </td>
        </tr>
    {{/each}}
    </tbody>
    </table>
