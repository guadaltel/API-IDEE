<div>
    <h2
        style="text-align: center; color: var(--idee-color-white, #fff); background-color: var(--idee-color-neutral-80, #364b5f); padding: 8px 10px; text-transform: uppercase;">
        {{title}}
        <img style="vertical-align: bottom; filter: invert(100%); display: inline-block;"
            src="{{iconUrl}}" width="30" height="30" alt="{{title}}" />
    </h2>
    <p>{{translations.paragraph1}}</p>
    <div>
        <figure style="max-width:70%; margin: 0 auto; display: block; text-align: center;">
            <img style="max-width:100%; height:auto; margin:0 auto; display:block;" src="{{urlImages}}help-01.png"
                alt="{{translations.screenshot1Alt}}" />
        </figure>
        <p style="margin-top: 3rem;">{{translations.screenshot2Description}}</p>
        <figure style="max-width:70%; margin: 0 auto; display: block; text-align: center;">
            <img style="max-width:100%; height:auto; margin:0 auto; display:block;" src="{{urlImages}}help-02.png"
                alt="{{translations.screenshot2Alt}}" />
        </figure>
    </div>
</div>
